# 열린 PR 에 커밋이 push 될 때마다 Codex 리뷰를 요청한다("@codex review" 댓글).
# Codex 자동 리뷰는 PR 을 열 때·draft 를 ready 로 바꿀 때만 돌고 이후 push 에는 돌지 않아서, 추가 커밋이 리뷰 없이 머지되는 것을 막는다.
# - draft PR 은 건너뛴다(여러 번 push 하는 동안 리뷰가 몰리지 않게 — ready 로 바꾸면 Codex 가 스스로 리뷰한다)
# - 짧은 간격으로 여러 번 push 하면 마지막 push 에 대해서만 요청한다(concurrency)
# - 댓글은 개인 토큰(secret CODEX_TRIGGER_PAT)으로 단다. Codex 는 댓글 작성자가 Codex 계정과 연결된 사용자일 때만 리뷰하므로
#   기본 GITHUB_TOKEN(github-actions[bot])으로는 "create a Codex account" 답만 온다.
#   토큰: fine-grained, 이 저장소만, Pull requests·Issues Read and write. 만료되면 갱신해야 한다
# - secret 이 없으면(템플릿으로 막 만든 저장소 등) 실패하지 않고 안내만 남기고 넘어간다
name: Codex review on push

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    # fork PR 은 건너뛴다 — pull_request 이벤트에는 secret 이 전달되지 않아 실패하고,
    # pull_request_target 으로 돌리면 외부 push 마다 개인 토큰으로 리뷰를 요청하게 된다(필요하면 직접 "@codex review")
    # Dependabot 이 push(rebase 포함)한 경우도 건너뛴다 — Dependabot 이 실행한 워크플로에는 Actions secret 이 전달되지 않는다.
    # 사람이 Dependabot 브랜치에 push 하면 actor 가 그 사람이라 그대로 요청한다
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      # secrets 는 if 에서 바로 쓸 수 없어서 env 로 옮겨 검사한다
      GH_TOKEN: ${{ secrets.CODEX_TRIGGER_PAT }}
    steps:
      - name: Skip (CODEX_TRIGGER_PAT not set)
        if: env.GH_TOKEN == ''
        run: echo "::notice::CODEX_TRIGGER_PAT secret 이 없어 Codex 리뷰 요청을 건너뜁니다. 필요하면 PR 에 직접 \"@codex review\" 를 다세요."

      - name: Comment "@codex review"
        if: env.GH_TOKEN != ''
        run: gh pr comment "$PR_NUMBER" --body "@codex review"
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
